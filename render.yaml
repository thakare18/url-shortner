# Feature: Render provisions a free Go service; MongoDB credentials are entered in its dashboard.
services:
  - type: web
    name: quickshorturl-api
    runtime: go
    plan: free
    rootDir: backend
    buildCommand: go build -o bin/server .
    startCommand: ./bin/server
    healthCheckPath: /api/ready
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: quickshorturl
      - key: URL_ENCRYPTION_KEY
        sync: false
      - key: URL_ENCRYPTION_KEY_ID
        value: v1
      - key: PUBLIC_BASE_URL
        sync: false
